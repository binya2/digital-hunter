version: '3.8'

services:
  # ==================== Kafka =====================
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - ./data_volume/kafka-confluent:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Elasticsearch =====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./data_volume/es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Kibana =====================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ==================== Postgres =====================
  postgres:
    image: postgres:15
    container_name: local-postgres
    ports: [ '5432:5432' ]
    environment:
      POSTGRES_DB: digital_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./data_volume/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== Microservices =====================
  intel-service:
    build:
      context: .
      dockerfile: intel_service/Dockerfile
    container_name: intel-service
    environment:
      - SERVICE_NAME=intel_service
      - KAFKA_BROKER=kafka:29092
      - CONSUME_TOPIC=intel
      - PRODUCE_TOPIC=intel_signals_dlq
      - GROUP_ID=intel_group
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=digital_hunter
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - ELASTICSEARCH_HOST=elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
      simulator:
        condition: service_started

  attack-service:
    build:
      context: .
      dockerfile: attack_service/Dockerfile
    container_name: attack-service
    environment:
      - SERVICE_NAME=attack_service
      - KAFKA_BROKER=kafka:29092
      - CONSUME_TOPIC=attack
      - PRODUCE_TOPIC=intel_signals_dlq
      - GROUP_ID=attack_group
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=digital_hunter
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - ELASTICSEARCH_HOST=elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
      simulator:
        condition: service_started

  damage-service:
    build:
      context: .
      dockerfile: damage_service/Dockerfile
    container_name: damage-service
    environment:
      - SERVICE_NAME=damage_service
      - KAFKA_BROKER=kafka:29092
      - CONSUME_TOPIC=damage
      - PRODUCE_TOPIC=intel_signals_dlq
      - GROUP_ID=damage_group
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=digital_hunter
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - ELASTICSEARCH_HOST=elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
      simulator:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: simulator
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy